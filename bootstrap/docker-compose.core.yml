# VPS OS Core Platform Stack (Steps 3, 4, 5, 8)
# Never commit real secrets here; configure runtime values in /vps-os/.env

services:
  caddy:
    image: caddy:2-alpine
    container_name: vps-os-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - VPS_OS_DOMAIN=${VPS_OS_DOMAIN:-localhost}
      - VPS_OS_ACME_EMAIL=${VPS_OS_ACME_EMAIL:-admin@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/apps.d:/etc/caddy/apps.d:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    networks:
      - vps-os-core
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3

  dashboard-api:
    build:
      context: ${VPS_OS_REPO_DIR:-..}
      dockerfile: bootstrap/Dockerfile
      target: api
    image: vps-os/dashboard-api:local
    container_name: vps-os-dashboard-api
    restart: unless-stopped
    environment:
      - PORT=3001
      - VPS_OS_REGISTRY_DB=/data/registry.db
      - VPS_OS_WEB_DIST=/srv/vps-os/dashboard/web/dist
      - VPS_OS_ADMIN_TOKEN=${VPS_OS_ADMIN_TOKEN:?VPS_OS_ADMIN_TOKEN must be set}
    volumes:
      - ./data:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - vps-os-core
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  agent:
    build:
      context: ${VPS_OS_REPO_DIR:-..}
      dockerfile: bootstrap/Dockerfile
      target: agent
    image: vps-os/agent:local
    container_name: vps-os-agent
    restart: unless-stopped
    environment:
      - PORT=3002
      - VPS_OS_REGISTRY_DB=/data/registry.db
      - VPS_OS_APPS_ROOT=/apps
      - VPS_OS_ADMIN_TOKEN=${VPS_OS_ADMIN_TOKEN:?VPS_OS_ADMIN_TOKEN must be set}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_MODEL=${LLM_MODEL:-gpt-4.1}
      - LLM_API_KEY=${LLM_API_KEY:-replace-with-your-api-key}
    volumes:
      - ./data:/data
      - /apps:/apps
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - vps-os-core
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/agent/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  caddy_data:
  caddy_config:

networks:
  vps-os-core:
    name: ${CORE_NETWORK:-vps-os-core}
    external: true
