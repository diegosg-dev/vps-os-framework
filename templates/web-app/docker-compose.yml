# Locked Apartment Template: Isolated Web Application

services:
  web:
    image: ${APP_IMAGE:-nginxinc/nginx-unprivileged:alpine}
    container_name: vps-os-app-${APP_SLUG}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/usr/share/nginx/html:ro
    cpus: "0.5"
    mem_limit: 512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${APP_PORT:-8080}/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  app_net:
    driver: bridge
